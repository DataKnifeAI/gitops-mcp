apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-network-mcp
  namespace: mcp-servers
  labels:
    app: unifi-network-mcp
    component: mcp-server
    managed-by: gitops
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - unifi-network-mcp.dataknife.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: unifi-network-mcp
          port: 8000
